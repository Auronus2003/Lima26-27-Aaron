<body>
    <h1>Inscripción a un taller tecnologico</h1>
<form action="#" method="get">
    <fieldset>
        <legend>1. Datos personales</legend>
        <p>
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Tu nombre" required minlength="3" maxlength="40"><br><br>
            
            <label for="apellidos">Apellidos</label>
            <input type="text" name="apellidos" id="apellidos" placeholder="Tus apellidos" required minlength="6" maxlength="60"><br><br>

            <label for="contraseña">Contraseña</label>
            <input type="text" name="contraseña" id="contraseña" placeholder="Tu contraseña" required minlength="8" maxlength="20" pattern="(?=.*[A-Za-z])(?=.*[0-9]).*"><br>

        </p>
    </fieldset>
        <fieldset>
        <legend></legend>
    </fieldset>
        <fieldset>
        <legend></legend>
    </fieldset>
</form>
