<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" content="text/css" href="estilos.css">
</head>

<body>
    <form id="music-form" action="#" method="post">
        <section>
            <h3>Validación de formularios</h3>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>

            <input type="email" id="email" name="email" placeholder="Correo electrónico" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" required>

            <input type="text" id="apodo" name="apodo" placeholder="Apodo">

            <input type="text" id="grupo-musica" name="grupo-musica" placeholder="Grupo de música favorito">
        </section>
    </form>
</body>

</html>
