<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Aaron"/>
        <meta name="description" content="html"/>
        <meta name="keywords" content="html"/>
        <title>Listas</title>
    </head>
    <body>
        <h1>Listas desordenadas</h1>
        <ul>
            <li>Café</li>
            <li>Auga</li>
            <li>Leite</li>
        </ul>
        <h1>Listas ordenadas</h1>
        <ol>
            <li>Café</li>
            <li>Auga</li>
            <li>Leite</li>
        </ol>
        <h1>Lista mixta</h1>
        <ul>
            <li>Café
                <ol>
                    <li>Só</li>
                    <li>Con leite
                        <ol>
                            <li>Latte</li>
                            <li>Cappuccino</li>
                        </ol>
                    </li>
                </ol>
            </li>
            <li>Auga</li>
            <li>Leite</li>
        </ul>
        <h1>Listas de definición</h1>
        <dl>
            <dt>Coche</dt>
            <dd>Vehículo de cuatro ruedas</dd>
            <dt>Moto</dt>
            <dd>Vehículo de dos ruedas</dd>
        </dl>
    </body>
</html>
