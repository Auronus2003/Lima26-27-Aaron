<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Aaron" />
    <meta name="description" content="html" />
    <meta name="keywords" content="html" />
    <title>Formulario en HTML</title>
</head>

<body>
    <h1>Formulario de Rexistro</h1>
    <form action="#" method="GET">
        <p>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required autofocus>
        </p>
        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="web">URL:</label><br>
            <input type="url" id="web" name="web" placeholder="Escribe a URL da túa web persoal">
        </p>
        <p>
            <label for="data">Data:</label><br>
            <input type="date" id="data" name="data">
        </p>
        <p>
            <label for="hora">Hora:</label><br>
            <input type="time" id="hora" name="hora">
        </p>
        <p>
            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade" min="18" max="65">
        </p>
        <p>
            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono">
        </p>
        <p>
            <label for="cor">Cor favorita:</label><br>
            <input type="color" id="cor" name="cor">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>

</html>
